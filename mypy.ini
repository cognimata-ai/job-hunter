[mypy]
strict = True
files = backend/src, tests
plugins = pydantic.mypy

[mypy-pyotp.*]
ignore_missing_imports = True

[mypy-greenlet.*]
ignore_missing_imports = True

# defusedxml 0.7.1 ships no type information (Personio XML, sources/ats/personio.py)
[mypy-defusedxml.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy]
strict = True
files = backend/src, tests, embedder
plugins = pydantic.mypy

[mypy-pyotp.*]
ignore_missing_imports = True

[mypy-greenlet.*]
ignore_missing_imports = True

# defusedxml 0.7.1 ships no type information (Personio XML, sources/ats/personio.py)
[mypy-defusedxml.*]
ignore_missing_imports = True

# The embedder's model runtime (embedder/app.py, OnnxModel): the `embedder` dependency group, which the base
# environment does not install; onnxruntime ships no type information
[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-tokenizers.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

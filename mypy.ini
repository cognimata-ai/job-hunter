[mypy]
strict = True
files = backend/src, tests, embedder, docparse, scripts/smoke_m5.py
plugins = pydantic.mypy

[mypy-pyotp.*]
ignore_missing_imports = True

[mypy-greenlet.*]
ignore_missing_imports = True

# croniter 6.2.4 ships no type information (the backup scheduler's cron expressions, backup/scheduler.py)
[mypy-croniter.*]
ignore_missing_imports = True

# defusedxml 0.7.1 ships no type information (Personio XML, sources/ats/personio.py)
[mypy-defusedxml.*]
ignore_missing_imports = True

# The embedder's model runtime (embedder/app.py, OnnxModel): the `embedder` dependency group, which the base
# environment does not install; onnxruntime ships no type information
[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-tokenizers.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

# The docparse extractors (docparse/extract.py): the `docparse` dependency group. All three ship their types,
# which mypy uses wherever the group is installed (the CI lint job installs it); the base environment does not.
[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

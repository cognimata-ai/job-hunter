# Dev only: the worker's Claude calls served by the recorded fake (llm/fake.py, spec §18.4; plan Task 23) from
# the committed streams under tests/contract/fixtures/anthropic, so no request reaches Anthropic whatever the
# anthropic_key holds. Layered over the dev stack, alone or with the source fixtures:
#
#   docker compose --env-file deploy/images.lock -f deploy/compose.dev.yaml -f deploy/compose.fakellm.yaml \
#     up -d --build --wait
#
# The same mount serves the Message Batches API (M3 Task 8): with no test to register a script, the fake
# answers every batch as `BatchScript()` does (one in-progress poll, then every item succeeded), each item's
# message made from the committed `generate` recording of its model and schema (an item without one is
# errored). Batches live in the worker's memory only, and its batch ids never repeat across restarts; the
# 50 newest keep their full params, an older one only each item's model, max_tokens and output schema.
#
# The api runs on the fake as well (M3 Task 20, Ruling T20-c): its eval gate then counts the fake eval runs the
# worker makes, and its settings save needs no live schema dry-run, as the worker's score lane does.
#
# Never in prod: the startup assertion `fake_mode_in_prod` refuses JOBHUNTER_FAKE_LLM there (exit 78).
services:
  api:
    environment:
      JOBHUNTER_FAKE_LLM: "1"
  worker:
    environment:
      JOBHUNTER_FAKE_LLM: "1"
      JOBHUNTER_FAKE_LLM_DIR: /data/fixtures/anthropic
    volumes:
      - ../tests/contract/fixtures/anthropic:/data/fixtures/anthropic:ro

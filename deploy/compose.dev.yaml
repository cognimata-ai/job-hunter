# The dev stack (spec §19.1, §19.2; Task 18). Every call passes the digest lock as its env file:
#
#   scripts/dev-secrets.sh            # as root (sudo), it sets group 10010 on the secret files
#   docker compose --env-file deploy/images.lock -f deploy/compose.dev.yaml up -d --build --wait
#
# Run dev-secrets.sh again after a change that adds a secret file: it creates the missing ones and keeps the
# others. M2 Task 23 added the worker's anthropic_key, so a stack set up before it does not start until then.
#
# The worker's anthropic_key is the JOBHUNTER_ANTHROPIC_API_KEY that dev-secrets.sh was run with (`sudo
# --preserve-env=JOBHUNTER_ANTHROPIC_API_KEY`), or an empty file: the worker then starts without a key and every
# LLM call fails llm_not_configured (M2 Task 23). deploy/compose.fakellm.yaml serves every Claude call from the
# recorded fixtures instead.
#
# Images come from deploy/images.lock only: `${name:?}` fails loudly when a digest line is missing. The one dev
# origin is http://localhost:8080, served by devproxy on the host's loopback only. The api has no route out
# (its networks `proxy` and `internal` are both internal); only the worker reaches `egress`. The embedder
# (Task 22) is on `internal` only: its model is baked into its image, checked against embedder/model.lock at
# every start (§16.8), and the worker starts once it is healthy. docparse (M2 Task 8) has no network at all: it
# exchanges files with the worker on the `parse_jobs` tmpfs only (§12.2).
name: jobhunter-dev

x-app-build: &app-build
  context: ..
  dockerfile: Dockerfile
  args:
    PYTHON_IMAGE: "${python:?}"
    UV_IMAGE: "${uv:?}"
  # Optional: a CA bundle for the package downloads of the build, for hosts behind a TLS-intercepting proxy
  # (SSL_CERT_FILE of the calling shell; empty when unset). Mounted for the RUN steps only, never in a layer.
  secrets: [build_ca]

x-app: &app
  image: jobhunter-app:dev
  build: *app-build
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  group_add: ["10010"] # jobhunter-secrets: reads the 0440 secret files (§19.2)
  logging: { driver: local, options: { max-size: 20m, max-file: "10" } }
  restart: unless-stopped
  # Docker's init as PID 1 forwards signals: as PID 1 itself, a process ignores a SIGTERM it has no handler for
  # (a standby or starting worker, migrate), so a stop would wait out the grace period and then kill it.
  init: true

# The non-secret environment of the app services (§19.2). Never set JOBHUNTER_FAULT or JOBHUNTER_FAKE_* here:
# a variable that is set counts as present, even when empty.
x-app-env: &app-env
  JOBHUNTER_ENV: dev
  JOBHUNTER_DB_HOST: postgres
  JOBHUNTER_DB_PORT: "5432"
  JOBHUNTER_DB_NAME: jobhunter
  JOBHUNTER_LOG_LEVEL: INFO

services:
  postgres:
    image: "${pgvector:?}"
    user: "999:999" # the image's postgres user; no root step, so group_add applies
    group_add: ["10010"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap
    secrets: [pg_bootstrap, db_app, db_migrator, db_backup, db_restore] # role passwords: init only (§19.3)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks: [internal]
    shm_size: 1g
    # Over TCP: the image's init phase runs a temporary server that listens on the Unix socket only, so a socket
    # probe would report ready before the init scripts have finished and the final server has started.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      start_period: 120s
      start_interval: 1s
    mem_limit: 5g
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["jobhunter", "migrate"] # §19.3
    restart: "no"
    environment: *app-env
    secrets: [db_migrator]
    networks: [internal]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *app
    # `jobhunter api` runs the startup assertions first (exit 78), then uvicorn (ruling T18-b).
    command:
      [
        "jobhunter", "api", "--host", "0.0.0.0", "--port", "8000",
        "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2",
      ]
    environment:
      <<: *app-env
      JOBHUNTER_PUBLIC_ORIGIN: http://localhost:8080
      JOBHUNTER_EMBEDDER_URL: http://embedder:8080 # readiness and system health probe it
    secrets: [session_secret, data_key, db_app]
    volumes: [cv_store:/data/cv] # the encrypted CV uploads (§12.1)
    networks: [proxy, internal] # both internal: no route to the internet
    healthcheck:
      test: ["CMD", "jobhunter", "http-check", "http://localhost:8000/healthz"]
      interval: 15s
      start_period: 60s
      start_interval: 1s
    depends_on: { migrate: { condition: service_completed_successfully } }
    mem_limit: 1g

  worker:
    <<: *app
    command: ["jobhunter", "worker"]
    deploy: { replicas: 1 } # MUST stay 1 (§3.3)
    stop_grace_period: 120s
    environment:
      <<: *app-env
      JOBHUNTER_PUBLIC_ORIGIN: http://localhost:8080
      JOBHUNTER_EMBEDDER_URL: http://embedder:8080
    secrets: [data_key, db_app, anthropic_key] # anthropic_key may be empty: no key (M2 Task 23)
    volumes: [cv_store:/data/cv, parse_jobs:/data/parse]
    # A service-level group_add replaces the x-app list: the secrets group again, and jobhunter-parse, the
    # group of the parse_jobs tmpfs it shares with docparse (§19.1).
    group_add: ["10010", "10011"]
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "jobhunter", "worker-health"]
      interval: 30s
      start_period: 120s
      start_interval: 2s
    depends_on:
      migrate: { condition: service_completed_successfully }
      embedder: { condition: service_healthy }
    mem_limit: 2g

  embedder:
    image: jobhunter-embedder:dev
    build:
      context: ..
      dockerfile: embedder/Dockerfile
      args:
        PYTHON_IMAGE: "${python:?}"
        UV_IMAGE: "${uv:?}"
      secrets: [build_ca] # the optional CA bundle of the build's downloads, as for the app image
    # Not in the secrets group and given no secret (§19.2); it writes nothing at run time.
    read_only: true
    user: "10004:10004"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal] # no route out: the model is in the image
    # embedder-health: GET /health within 3 s, exit 0 iff 200 with checksum_ok (embedder/health.py). The model
    # loads in a few seconds; a failed checksum exits 78 at start and the restart policy tries again.
    healthcheck:
      test: ["CMD", "embedder-health"]
      interval: 30s
      start_period: 120s
      start_interval: 2s
    logging: { driver: local, options: { max-size: 20m, max-file: "10" } }
    mem_limit: 3500m # the fp32 export: about 2.6 GB RSS under load (V7, ruling T21-a)
    cpus: 3
    restart: unless-stopped

  docparse:
    image: jobhunter-docparse:dev
    build:
      context: ..
      dockerfile: docparse/Dockerfile
      args:
        PYTHON_IMAGE: "${python:?}"
        UV_IMAGE: "${uv:?}"
      secrets: [build_ca] # the optional CA bundle of the build's downloads, as for the app image
    # No network at all (§12.2): the worker hands it files on the parse_jobs tmpfs, group 10011 for both.
    # Never in the secrets group, given no secret; it writes only the job files there and its own /tmp.
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10002:10002"
    group_add: ["10011"]
    volumes: [parse_jobs:/data/parse]
    logging: { driver: local, options: { max-size: 20m, max-file: "10" } }
    mem_limit: 1g # one job at a time: a child of at most 768 MiB (RLIMIT_AS)
    # The loop, its resource tracker and one parse child (which starts no process: RLIMIT_NPROC 0), with room
    # for an operator's `exec`. Past it, a parse that escaped its limits can fork nothing more (final review
    # FR-11). A failed leftover sweep exits 70 and the restart ends every process in the container.
    pids_limit: 16
    restart: unless-stopped

  devproxy:
    image: "${caddy:?}"
    # Not in the secrets group and given no secret (§19.2). The image's caddy binary carries the file capability
    # cap_net_bind_service, which execve refuses unless it is in the bounding set; port 8080 does not use it.
    user: "10003:10003"
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: [./Caddyfile.dev:/etc/caddy/Caddyfile:ro]
    networks:
      devedge: {}
      proxy: { ipv4_address: 172.30.0.2 } # fixed: the only trusted forwarder (§16.3)
    depends_on: { api: { condition: service_healthy } }
    logging: { driver: local, options: { max-size: 20m, max-file: "10" } }
    restart: unless-stopped

networks:
  devedge: {} # the host's way in: devproxy only, published on 127.0.0.1
  proxy:
    internal: true
    ipam:
      config:
        # Dynamic addresses come from the upper half only, so the api (started before devproxy) can never take
        # devproxy's fixed 172.30.0.2.
        - { subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25, gateway: 172.30.0.1 }
  internal: { internal: true }
  egress: {} # the worker only

volumes:
  pgdata: {}
  cv_store: {} # the encrypted CV files (§12.1); the app image's /data/cv gives it 10001:10001, mode 0700
  # RAM only, so a decrypted CV never reaches a disk (§12.2); the setgid root (2770, group 10011) gives every
  # per-job directory the group that both the worker and docparse hold.
  parse_jobs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=256m,uid=0,gid=10011,mode=2770" } # as §19.1

# The files of scripts/dev-secrets.sh: group 10010, mode 0440, in a 0750 directory (§19.2).
secrets:
  session_secret: { file: ../.secrets/dev/session_secret }
  data_key: { file: ../.secrets/dev/data_key }
  db_app: { file: ../.secrets/dev/db_app }
  db_migrator: { file: ../.secrets/dev/db_migrator }
  db_backup: { file: ../.secrets/dev/db_backup }
  db_restore: { file: ../.secrets/dev/db_restore }
  pg_bootstrap: { file: ../.secrets/dev/pg_bootstrap }
  anthropic_key: { file: ../.secrets/dev/anthropic_key }
  build_ca: { file: "${SSL_CERT_FILE:-/dev/null}" }

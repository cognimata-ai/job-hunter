# The compose test stack (plan M5 Task 21, M5-R4 R29): the production compose with `JOBHUNTER_ENV=test`, its
# stand-ins and its probes, layered over deploy/compose.yaml with deploy/compose.test.env (`PT`):
#
#   docker compose -p jobhunter-prodtest --env-file deploy/images.lock --env-file deploy/compose.test.env \
#     -f deploy/compose.yaml -f deploy/compose.test.yaml up -d --build --wait caddy api worker docparse stubsvc
#
# Its restore target `PB` is the same with `-p jobhunter-prodtest-b`. The S3 stand-in is a project of its own,
# deploy/compose.s3stub.yaml (`S3`), started first: it creates the network `jobhunter-s3net` that backup and
# restore join here, and it outlives this project's `down -v`, as offsite storage outlives a lost VPS. The
# secrets are scripts/test-secrets.sh's dummies (`sudo scripts/test-secrets.sh`). tests/support/prodstack.py
# drives all of it; this stack holds 172.30.0.0/24 as the dev stack does, so only one of them runs at a time.
#
# - The images are the dev stack's tags, built here as compose.dev.yaml builds them: the app and backup stages
#   of the root Dockerfile, docparse, and the embedder's `fake` target (EMBEDDER_FAKE: deterministic vectors,
#   no model). The four variables are compose.test.env's.
# - The worker is served from the scrubbed fixtures and the recorded Claude streams (compose.fixtures.yaml,
#   compose.fakellm.yaml; the api runs on the fake LLM too, as the fake overlay has it), traces nothing, and
#   takes a crash-injection point from JOBHUNTER_FAULT (empty: none). Its ntfy topic and healthchecks API are
#   stubsvc's (tests/stack/stubs/http_recorder.py), on `egress`.
# - Caddy serves `localhost` with its internal CA (Caddyfile.test) on 127.0.0.1:8443 and 127.0.0.1:8081 only.
# - The probes (profile `probe`) are clients on `edge` at fixed addresses: `$PT run --rm probe1 python -I -c …`.
# - Smaller memory for a dev container: postgres 1 GB (its buffers to match), the embedder 1 GB, the worker
#   1500 MB (its /tmp tmpfs stays compose.yaml's: an upper bound, not a reservation).

x-logging: &logging
  driver: local
  options: { max-size: 20m, max-file: "10" }

# The root Dockerfile's builds (compose.dev.yaml's x-app-build): every FROM needs its image, built or not.
x-app-build: &app-build
  context: ..
  dockerfile: Dockerfile
  target: runtime
  args:
    PYTHON_IMAGE: "${python:?}"
    UV_IMAGE: "${uv:?}"
    NODE_IMAGE: "${node:?}"
    RESTIC_IMAGE: "${restic:?}"
    PGVECTOR_IMAGE: "${pgvector:?}"
  # Optional: a CA bundle for the build's downloads behind a TLS-intercepting proxy (compose.dev.yaml).
  secrets: [build_ca]

# The stand-ins and probes: the pinned python image, unprivileged, read-only.
x-python: &python
  image: "${python:?}"
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  postgres:
    command:
      [
        "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "shared_buffers=256MB", "-c", "effective_cache_size=512MB", "-c", "maintenance_work_mem=64MB",
      ]
    mem_limit: 1g

  migrate:
    build: *app-build

  api:
    build: *app-build
    environment:
      JOBHUNTER_FAKE_LLM: "1"

  worker:
    build: *app-build
    environment:
      JOBHUNTER_FAKE_SOURCES: "1"
      JOBHUNTER_FIXTURES_DIR: /data/fixtures
      JOBHUNTER_FAKE_LLM: "1"
      JOBHUNTER_FAKE_LLM_DIR: /data/fixtures/anthropic
      LANGSMITH_TRACING: "false"
      JOBHUNTER_FAULT: ${JOBHUNTER_FAULT:-} # empty: no fault (faults.py); Task 26's C39 sets one
    volumes:
      - ../tests/contract/fixtures:/data/fixtures:ro
    mem_limit: 1500m

  backup:
    build:
      <<: *app-build
      target: backup
    # The stack tests run the set, the prune and the restore test by their CLI (Ruling T26-1 (a) T24-4 M2), so
    # the scheduler never starts one during a test: the set and the prune on 29 February only, the restore
    # test on 1 January only (its cron must fire in a month's first seven days, `backup.cron`). It ships every
    # minute.
    environment:
      JOBHUNTER_MANIFEST_SHIP_CRON: "* * * * *"
      JOBHUNTER_BACKUP_CRON: "0 0 29 2 *"
      JOBHUNTER_BACKUP_PRUNE_CRON: "0 0 29 2 *"
      JOBHUNTER_RESTORE_TEST_CRON: "0 0 1 1 *"
    networks: [internal, egress, s3net]

  restore:
    build:
      <<: *app-build
      target: backup
    networks: [internal, egress, s3net]

  docparse:
    build:
      context: ..
      dockerfile: docparse/Dockerfile
      args:
        PYTHON_IMAGE: "${python:?}"
        UV_IMAGE: "${uv:?}"
      secrets: [build_ca]

  embedder:
    build:
      context: ..
      dockerfile: embedder/Dockerfile
      target: fake
      args:
        PYTHON_IMAGE: "${python:?}"
        UV_IMAGE: "${uv:?}"
      secrets: [build_ca]
    environment:
      EMBEDDER_FAKE: "1"
      JOBHUNTER_ENV: ${JOBHUNTER_ENV:?} # embedder/app.py refuses the fake outside dev and test
    mem_limit: 1g

  caddy:
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
    ports: !override ["127.0.0.1:8443:443", "127.0.0.1:8081:80"]

  # The ntfy and healthchecks stand-in (stdlib only): it records what the worker sends, never a header's value.
  stubsvc:
    <<: *python
    command: ["python", "-I", "/stub/http_recorder.py", "--port", "8099"]
    volumes:
      - ../tests/stack/stubs:/stub:ro
    networks: [egress]
    healthcheck:
      test:
        [
          "CMD", "python", "-I", "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/_log', timeout=2)",
        ]
      interval: 10s
      start_period: 30s
      start_interval: 1s
    mem_limit: 128m
    restart: unless-stopped

  # Clients on the internet-facing network at known addresses (N1, N2): run with a command.
  probe1:
    <<: *python
    profiles: [probe]
    networks:
      edge: { ipv4_address: 172.30.1.11 }
    mem_limit: 128m
    restart: "no"

  probe2:
    <<: *python
    profiles: [probe]
    networks:
      edge: { ipv4_address: 172.30.1.12 }
    mem_limit: 128m
    restart: "no"

networks:
  s3net:
    name: jobhunter-s3net
    external: true # deploy/compose.s3stub.yaml's

secrets:
  build_ca: { file: "${SSL_CERT_FILE:-/dev/null}" }

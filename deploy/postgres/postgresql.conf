# Job Hunter PostgreSQL server settings (spec §19.1). The compose file and the test harness pass
# `-c config_file=/etc/postgresql/postgresql.conf`; the harness overrides the three memory and connection
# values below on the command line to suit a CI container.

listen_addresses = '*'

# memory and connections
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB
max_connections = 60

# a client that dies mid-transaction must not hold locks for long
idle_in_transaction_session_timeout = 60s
tcp_keepalives_idle = 30
tcp_keepalives_interval = 10
tcp_keepalives_count = 3

# PostgreSQL's own logs never carry statement text, bind parameters or key values (spec §16.8):
# application redaction does not cover them.
logging_collector = off
log_statement = none
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = panic
log_error_verbosity = terse

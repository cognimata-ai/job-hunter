# CI for Job Hunter (spec §18.8, the M0 to M2 subset, and M5's image scan): lint, unit, integration, contract,
# payload, docparse, images, frontend and audit.
# The live smoke of the free sources is the separate, manual and weekly smoke-free-sources.yml; no job here calls
# a provider.
#
# Supply chain: every action is pinned to a full commit SHA (the release tag is the trailing comment), uv and Node
# to exact versions, the container images (PostgreSQL, gitleaks, Trivy) and the base images of every build to
# digests in deploy/images.lock. No job uses a secret or a provider key: the token is read-only and the
# checkout does not keep it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      # `uv sync --frozen` installs uv.lock as it is; this fails when pyproject.toml and uv.lock disagree.
      - run: uv lock --check
      # With the docparse group: mypy checks docparse/ against the types pypdf, pdfplumber and python-docx ship.
      - run: uv sync --frozen --group docparse
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The AST half of the LLM boundary (spec §10.1): no tools, tool_choice or sampling parameters, structured
      # output only as json_schema, no assistant prefill; ruff's TID251 is the import half.
      - run: uv run python scripts/check_llm_boundary.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run --prefix frontend lint
      - run: npm run --prefix frontend typecheck
      # The official container image, pinned by digest (gitleaks-action needs a paid licence for organisation
      # repositories). It scans every commit; .gitleaks.toml holds the allowlist of known false positives. It
      # runs even when an earlier lint step failed, so a leak is reported on every run that is not cancelled.
      - name: gitleaks
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/repo:ro" "$(grep ^gitleaks= deploy/images.lock | cut -d= -f2)"
          git --redact --no-banner --config /repo/.gitleaks.toml -v /repo

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      # With the docparse group: tests/unit/test_v12_replay.py replays V12 through Task 11's op_runner, which
      # serves parse jobs with an in-process `docparse.worker` loop and checks the group is installed.
      - run: uv sync --frozen --group docparse
      # tests/embedder runs in the base environment: the embedder app tests need no model and no `embedder`
      # group (Task 21); the `embedder_model` tests that load the model are deselected (pyproject addopts).
      # tests/live: addopts deselects its `live` tests too, so only its offline paid-host guards run here.
      - run: uv run pytest -W error tests/unit tests/property tests/embedder tests/live -q

  integration:
    runs-on: ubuntu-24.04
    # M3's suite takes about 50 minutes on a hosted runner (47 and 50 minutes on c41d2df); the bound leaves
    # room for a slower runner and M4's tests.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      # The docparse group: tests/integration/test_parse_client.py, and Task 11's op_runner, serve parse jobs
      # with an in-process `docparse.worker` loop.
      - run: uv sync --frozen --group docparse
      # The harness (tests/support/pg.py) runs this image and is the only test code that needs Docker.
      - run: docker pull "$(grep ^pgvector= deploy/images.lock | cut -d= -f2)"
      - run: uv run pytest -W error tests/integration tests/crash -q

  # The adapter contract tests on the scrubbed fixtures and the fixture PII scan (spec §18.4): offline, no
  # database.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run pytest -W error tests/contract -q

  # The LLM payload contract tests (spec §10.9, §18.5; M0 Deviation 15): the request bodies of the gateway
  # against the policy, offline, no database and no provider key.
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run pytest -W error tests/payload -q

  # The docparse extractor and its job runner (spec §12.2): the `docparse` group in process (`-m docparse`,
  # which the default run deselects), then the image, built from the digest-pinned bases of deploy/images.lock.
  # Its no-network test (N1's docparse half) runs on the compose stack (tests/stack, `-m stack`).
  docparse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen --group docparse
      - run: uv run pytest -W error -m docparse tests/docparse -q
      - name: docparse image
        run: >-
          docker build -f docparse/Dockerfile
          --build-arg PYTHON_IMAGE="$(grep ^python= deploy/images.lock | cut -d= -f2)"
          --build-arg UV_IMAGE="$(grep ^uv= deploy/images.lock | cut -d= -f2)"
          -t jobhunter-docparse:ci .

  # The release images (spec §19.1, §18.8; plan M5 Task 29, R11, Deviation 40), built as release.yml builds
  # them but pushed nowhere (no registry login, no push): the app (`runtime`), backup (`backup`; the root
  # Dockerfile's last stage, so every build of it names its target) and docparse images, and the embedder's
  # `fake` target (the real one downloads the model: embedder-image.yml). Every base image comes from the
  # digests of deploy/images.lock, and each build gets the optional `build_ca` secret as compose's
  # x-app-build passes it (SSL_CERT_FILE, /dev/null when unset). Then Trivy, by its digest in the lock, scans
  # the app, backup and docparse images through the Docker socket, and the job fails on a CRITICAL
  # vulnerability that has a fix (`--ignore-unfixed`).
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: app image
        run: >-
          docker build -f Dockerfile --target runtime
          --build-arg PYTHON_IMAGE="$(grep ^python= deploy/images.lock | cut -d= -f2)"
          --build-arg UV_IMAGE="$(grep ^uv= deploy/images.lock | cut -d= -f2)"
          --build-arg NODE_IMAGE="$(grep ^node= deploy/images.lock | cut -d= -f2)"
          --build-arg RESTIC_IMAGE="$(grep ^restic= deploy/images.lock | cut -d= -f2)"
          --build-arg PGVECTOR_IMAGE="$(grep ^pgvector= deploy/images.lock | cut -d= -f2)"
          --secret id=build_ca,src="${SSL_CERT_FILE:-/dev/null}"
          -t jobhunter-app:ci .
      - name: backup image
        run: >-
          docker build -f Dockerfile --target backup
          --build-arg PYTHON_IMAGE="$(grep ^python= deploy/images.lock | cut -d= -f2)"
          --build-arg UV_IMAGE="$(grep ^uv= deploy/images.lock | cut -d= -f2)"
          --build-arg NODE_IMAGE="$(grep ^node= deploy/images.lock | cut -d= -f2)"
          --build-arg RESTIC_IMAGE="$(grep ^restic= deploy/images.lock | cut -d= -f2)"
          --build-arg PGVECTOR_IMAGE="$(grep ^pgvector= deploy/images.lock | cut -d= -f2)"
          --secret id=build_ca,src="${SSL_CERT_FILE:-/dev/null}"
          -t jobhunter-backup:ci .
      - name: docparse image
        run: >-
          docker build -f docparse/Dockerfile
          --build-arg PYTHON_IMAGE="$(grep ^python= deploy/images.lock | cut -d= -f2)"
          --build-arg UV_IMAGE="$(grep ^uv= deploy/images.lock | cut -d= -f2)"
          --secret id=build_ca,src="${SSL_CERT_FILE:-/dev/null}"
          -t jobhunter-docparse:ci .
      - name: embedder image, the fake target
        run: >-
          docker build -f embedder/Dockerfile --target fake
          --build-arg PYTHON_IMAGE="$(grep ^python= deploy/images.lock | cut -d= -f2)"
          --build-arg UV_IMAGE="$(grep ^uv= deploy/images.lock | cut -d= -f2)"
          --secret id=build_ca,src="${SSL_CERT_FILE:-/dev/null}"
          -t jobhunter-embedder:ci-fake .
      - name: scan the app image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$(grep ^trivy= deploy/images.lock | cut -d= -f2)"
          image --exit-code 1 --severity CRITICAL --ignore-unfixed jobhunter-app:ci
      - name: scan the backup image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$(grep ^trivy= deploy/images.lock | cut -d= -f2)"
          image --exit-code 1 --severity CRITICAL --ignore-unfixed jobhunter-backup:ci
      - name: scan the docparse image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$(grep ^trivy= deploy/images.lock | cut -d= -f2)"
          image --exit-code 1 --severity CRITICAL --ignore-unfixed jobhunter-docparse:ci

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: scripts/check-openapi-drift.sh

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      # Without the project itself: it is installed editable and is not on PyPI, so `pip-audit --strict` cannot
      # audit it and fails the run. `--no-sync` keeps `uv run` from installing it again. With the docparse
      # group (its parsers read untrusted files, §12.2) and the embedder group (the embedder image's runtime,
      # final review FR-15), so every deployed dependency is audited.
      - run: uv sync --frozen --no-install-project --group docparse --group embedder
      - run: uv run --no-sync pip-audit --strict
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.22.3"
      - run: npm audit --prefix frontend --omit=dev --audit-level=high

# The weekly live smoke of the free sources (spec §18.8): page 1 of Arbeitnow and of the six public ATS boards
# the contract fixtures were recorded from, one request each (tests/live, marker `live`). Free sources only,
# never a paid one: the test module refuses every host outside its allowlist before anything is sent, and this
# workflow has no secret and no provider key.
#
# Supply chain as in ci.yml: actions pinned to full commit SHAs (the release tag is the trailing comment), uv to
# an exact version; the token is read-only and the checkout does not keep it.
name: Free-source smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC

permissions:
  contents: read

concurrency:
  group: smoke-free-sources
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run pytest -m live tests/live -q

[project]
name = "jobhunter"
version = "0.1.0"
description = "Job Hunter: a job-matching agent platform"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "procrastinate==3.10.0",
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.2.0",
    "langchain-core==1.6.11",
    "anthropic==1.15.0",
    "langchain-anthropic==1.7.6",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "segno==1.6.6",
    "nh3==0.3.7",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
    "zstandard==0.25.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.170.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "respx==0.23.1",
    "pip-audit==2.10.1",
    "types-PyYAML==6.0.12.20260906",
]
# The embedder image only (embedder/Dockerfile: `uv sync --only-group embedder`); never in the app image. The
# base environment runs tests/embedder without it: embedder/app.py imports onnxruntime, tokenizers and numpy
# inside OnnxModel only. Runs that load the model add `--group embedder` (spike V7, `-m embedder_model`).
embedder = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "onnxruntime==1.31.0",
    "tokenizers==0.23.3",
    "numpy==2.5.4",
]
# The docparse image only (docparse/Dockerfile: `uv sync --only-group docparse`); never in the app image: the
# worker hands files to docparse over the parse_jobs volume (profile/parse_client.py) and imports none of it.
# docparse/extract.py imports these inside its functions, so the base environment imports docparse.worker. Runs
# that extract add `--group docparse`: `-m docparse tests/docparse`, and the integration tests that serve a
# `docparse.worker` loop in process (tests/integration/test_parse_client.py, Task 11's op_runner).
docparse = [
    "pypdf==6.20.1",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jobhunter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs the digest-pinned PostgreSQL container",
    "crash: kills real processes and asserts recovery",
    "stack: needs the full docker compose stack",
    "slow: takes more than a few seconds",
    "perf: performance measurement, never a correctness assertion",
    "contract: runs an adapter or the fixture scan on the scrubbed fixtures (tests/contract, spec §18.4)",
    "live: calls a real provider; never run in CI and deselected by default",
    "embedder_model: the real model in .model-cache/arctic; run with `uv run --group embedder pytest -m embedder_model`",
    "payload: an LLM payload contract test (tests/payload, spec §10.9): offline, no database",
    "docparse: the docparse extractor in process (tests/docparse); run with `uv run --group docparse pytest -m docparse tests/docparse`",
]
addopts = "-m 'not stack and not perf and not live and not embedder_model and not docparse'"

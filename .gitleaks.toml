# gitleaks configuration (CI job `lint`, container image pinned in deploy/images.lock).
#
# The default ruleset stays on. Every entry below allows one known false positive and nothing else: a rule, a
# file and the shape of the assignment must all match (condition = "AND"). A new finding anywhere else fails CI.
# Each regex is anchored to the whole line (`^\s*NAME\s*=\s*"…"\s*$`), so a line that holds anything besides
# that one assignment, another key included, is not allowed by it.
title = "Job Hunter gitleaks configuration"

[extend]
useDefault = true

# tests/unit/test_redact.py tests the log redactor (`mask_text`, `register_secret_values`). Its fixtures are
# random-looking literals of the lengths the redactor's rules key on (22, 32 and 40 characters; the tests assert
# the lengths) that the redactor must mask. They belong to no account or service.
[[allowlists]]
description = "random-looking redactor test vectors in tests/unit/test_redact.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/unit/test_redact\.py$''']
regexTarget = "line"
regexes = ['''^\s*(SECRET32|ADZUNA_KEY|random_key|ping_key)\s*=\s*"[A-Za-z0-9]+"\s*$''']

# tests/unit/test_config.py checks that `startup_or_exit` registers the loaded secret values with the redactor.
# `adzuna_key` is the random-looking stand-in written to a temporary secrets directory by that one test.
[[allowlists]]
description = "random-looking secret stand-in in tests/unit/test_config.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/unit/test_config\.py$''']
regexTarget = "line"
regexes = ['''^\s*adzuna_key\s*=\s*"[A-Za-z0-9]+"\s*$''']

# tests/unit/test_config.py checks that an empty secret of another role still counts as a foreign mount: the
# `anthropic_key` it writes is the empty byte string, no value at all. Only that one call, with `b""`, is allowed.
[[allowlists]]
description = "the empty anthropic_key stand-in in tests/unit/test_config.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/unit/test_config\.py$''']
regexTarget = "line"
regexes = ['''^\s*d = write_secrets\(tmp_path / "s", \*\*API_SECRETS, anthropic_key=b""\)\s*$''']

# tests/unit/test_worker_main.py (M5 Task 4) checks that the worker hands the `ntfy_token` secret to its alert
# dispatcher. Its `NTFY_TOKEN` stand-in was first a random-looking literal (commit ed23e04); fix round 1 made it a
# low-entropy one the default rules pass, so this entry covers only that line in the history. It belongs to no
# account or service.
[[allowlists]]
description = "the ntfy_token stand-in in tests/unit/test_worker_main.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/unit/test_worker_main\.py$''']
regexTarget = "line"
regexes = ['''^\s*NTFY_TOKEN\s*=\s*"[A-Za-z0-9_]+"\s*$''']

# scripts/spikes/v7_embedder.py (spike V7) pins the embedding model's files by sha256: each entry maps a file of
# the public model revision to its Hugging Face LFS object id, 64 lowercase hex characters. They are checksums
# of published files, not credentials. Only a dict entry of exactly that shape is allowed.
[[allowlists]]
description = "sha256 checksums of the public model files in scripts/spikes/v7_embedder.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^scripts/spikes/v7_embedder\.py$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_./-]+"\s*:\s*"[0-9a-f]{64}",?\s*$''']
